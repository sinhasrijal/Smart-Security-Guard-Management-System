<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Head Guard Login
    </title>

    <link
        rel="stylesheet"
        href="../css/login.css">

    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

    <div class="login-wrapper">

        <!-- LEFT SIDE -->

        <div class="login-left">

            <div class="login-overlay"></div>

            <div class="login-left-content">

    <div class="portal-badge">

        SGS HEAD GUARD PORTAL

    </div>

    <h1>

        Welcome Head Guard

    </h1>

    <p>

        Access the operational supervision
        dashboard for guard assignment,
        gate code generation
        and shift monitoring.

    </p>


    <div class="feature-list">

        <div class="feature-item">

            <i class="fa-solid fa-users"></i>

            <span>

                Assign Guards To Duties

            </span>

        </div>


        <div class="feature-item">

            <i class="fa-solid fa-key"></i>

            <span>

                Generate Secure Gate Codes

            </span>

        </div>


        <div class="feature-item">

            <i class="fa-solid fa-clock"></i>

            <span>

                Monitor Shift Operations

            </span>

        </div>

    </div>

</div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-right">

            <div class="login-box">

                <div class="login-logo">

                    <div class="logo-circle">

                        <i class="fa-solid fa-user-tie"></i>

                    </div>

                </div>

                <h2>

                    Head Guard Login

                </h2>

                <p>

                    Secure portal authentication

                </p>


                <!-- FORM -->

                <form id="headguardLoginForm">

                    <div class="input-group">

                        <label>
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                            required>

                    </div>


                    <div class="input-group">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="login-btn-main">

                        Access Portal

                    </button>

                </form>


                <div class="back-home">

                    <a href="/html/index.html">

                        ← Back to Home

                    </a>

                </div>

            </div>

        </div>

    </div>
    <script src="/js/headguard-login.js"></script>
</body>

</html>
